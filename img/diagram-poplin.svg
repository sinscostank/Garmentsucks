</style><rect class="bg" x="0" y="0" width="820" height="460"/><rect class="fr" x="14" y="14" width="792" height="432"/><text class="caps" x="40" y="52">POPLIN / PLAIN WEAVE</text><text class="lab" x="60" y="88">plain weave / fine warp, heavier weft</text><line class="thin" x1="120" y1="120" x2="520" y2="120"/><line class="thin" x1="120" y1="160" x2="520" y2="160"/><line class="thin" x1="120" y1="200" x2="520" y2="200"/><line class="thin" x1="120" y1="240" x2="520" y2="240"/><line class="thin" x1="120" y1="280" x2="520" y2="280"/><line class="thin" x1="120" y1="320" x2="520" y2="320"/><line class="acc" x1="120" y1="110" x2="120" y2="340"/><line class="acc" x1="168" y1="110" x2="168" y2="340"/><line class="acc" x1="216" y1="110" x2="216" y2="340"/><line class="acc" x1="264" y1="110" x2="264" y2="340"/><line class="acc" x1="312" y1="110" x2="312" y2="340"/><line class="acc" x1="360" y1="110" x2="360" y2="340"/><line class="acc" x1="408" y1="110" x2="408" y2="340"/><line class="acc" x1="456" y1="110" x2="456" y2="340"/><line class="acc" x1="504" y1="110" x2="504" y2="340"/><text class="lab" x="560" y="150">warp: fine, close</text><text class="lab" x="560" y="200">weft: heavier,</text><text class="lab" x="560" y="224">makes the rib</text><path class="acc" d="M560,260 L700,260 M700,260 l-10,-6 M700,260 l-10,6"/><text class="lab" x="560" y="284">rib runs across</text><path class="dash" d="M120,370 L520,370"/><text class="small" x="60" y="424">Original diagram — garmentsucks. Schematic; not to scale.</text></svg>